
name: Build Whatnot Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'whatnot-android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      - name: Build installable APK
        working-directory: whatnot-android
        run: gradle --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Whatnot-Android-APK
          path: whatnot-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
